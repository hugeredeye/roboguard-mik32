[platformio]
default_envs = mik32v2

[env:mik32v2]
platform = MIK32
board = mik32v2
framework = framework-mik32v2-sdk
board_build.ldscript = spifi
board_upload.maximum_size = 7864320
; Left FC-03 uses ELBEAR ACE-UNO D5 (PORT0.1).
build_flags =
    -DRG_LEFT_PORT=GPIO_0
    -DRG_LEFT_PIN=GPIO_PIN_1
    ; ESP32 GPIO25 heartbeat on ELBEAR D6 (PORT0.2).
    -DRG_HEARTBEAT_PORT=GPIO_0
    -DRG_HEARTBEAT_PIN=GPIO_PIN_2
    -DRG_INA219_ADDRESS=0x40
    -DRG_SHUNT_MILLIOHMS=100

platform_packages =
    framework-mik32v2-sdk @ https://github.com/MikronMIK32/framework-mik32v2-sdk.git#v0.2.2
upload_protocol = custom
upload_command = "elbear_uploader.exe" .pio\build\mik32v2\firmware.hex --com=COM3

[env:mik32v2-motors]
extends = env:mik32v2
build_flags = ${env:mik32v2.build_flags} -DRG_MOTOR_BENCH
upload_command = "elbear_uploader.exe" .pio\build\mik32v2-motors\firmware.hex --com=COM3
